name: peerup
description: "PeerUp - social English conversation platform (mobile app)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.2.7
  flutter_secure_storage: ^10.3.4
  socket_io_client: ^3.1.6
  flutter_webrtc: ^1.6.2+hotfix.3
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3
  google_fonts: ^6.2.1
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatars/
    - assets/characters/grace.riv
   